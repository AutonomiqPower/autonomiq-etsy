<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autonomiq Etsy OAuth Callback</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 24px;
        line-height: 1.4;
        color: #111;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        max-width: 760px;
      }
      .label {
        margin-top: 10px;
        font-size: 12px;
        color: #6b7280;
        letter-spacing: 0.02em;
      }
      .value {
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
        overflow-wrap: anywhere;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
      }
      .hint {
        margin-top: 8px;
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Etsy OAuth Callback</h2>
      <div class="hint">This page only displays the one-time authorization code and the exact returned state.</div>

      <div class="label">AUTHORIZATION CODE:</div>
      <div class="value" id="code">(missing)</div>

      <div class="label">STATE:</div>
      <div class="value" id="state">(missing)</div>

      <script>
        // IMPORTANT: Treat `state` as an opaque random string.
        // Do NOT decode it, atob() it, JSON.parse() it, or send it anywhere.
        // This page must not exchange the code for tokens.
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        document.getElementById('code').textContent = code ? code : '(missing)';
        document.getElementById('state').textContent = state ? state : '(missing)';
      </script>
    </div>
    <!-- deployment-trigger: touch file to force Pages rebuild -->
  </body>
</html>
